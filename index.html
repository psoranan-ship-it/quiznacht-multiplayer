<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiznacht – Party-Quiz</title>
<style>
  :root {
    --bg: #f6f0e2;
    --bg-spot: #ffffff;
    --surface: #ffffff;
    --surface-2: #efe6d2;
    --ink: #201a30;
    --ink-dim: #6c6480;
    --ink-faint: #a49cb6;
    --accent: #c97a00;
    --accent-ink: #fffaf0;
    --line: rgba(32,26,48,0.12);
    --shadow: 0 12px 30px rgba(32,26,48,0.10);

    --cat-tech: #0f8fb0;
    --cat-film: #c22672;
    --cat-sport: #1f7a52;
    --cat-allg: #c15a00;

    --font-display: "Archivo Black", "Arial Black", "Segoe UI", sans-serif;
    --font-body: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #120f1c; --bg-spot: #241c35; --surface: #1c1730; --surface-2: #251e3c;
      --ink: #f5f2ea; --ink-dim: #b6aec9; --ink-faint: #7c7392;
      --accent: #ffb703; --accent-ink: #1c1730;
      --line: rgba(245,242,234,0.10); --shadow: 0 20px 44px rgba(0,0,0,0.45);
      --cat-tech: #4cc9f0; --cat-film: #f72585; --cat-sport: #52b788; --cat-allg: #ffb703;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow-x: hidden; }
  body { min-height: 100vh; background-image: radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-spot) 0%, transparent 60%); }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  button { font-family: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  .app { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; display: flex; flex-direction: column; gap: 24px; min-height: 100vh; }

  .marquee { text-align: center; padding: 8px 0 4px; }
  .marquee .eyebrow { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
  .marquee h1 { font-family: var(--font-display); font-size: clamp(2.2rem, 7vw, 3.6rem); letter-spacing: 0.01em; line-height: 1; margin-top: 6px; text-transform: uppercase; }
  .marquee-bar { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
  .marquee-bar span { width: 34px; height: 6px; border-radius: 3px; }
  .marquee-bar span:nth-child(1) { background: var(--cat-tech); }
  .marquee-bar span:nth-child(2) { background: var(--cat-film); }
  .marquee-bar span:nth-child(3) { background: var(--cat-sport); }
  .marquee-bar span:nth-child(4) { background: var(--cat-allg); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 28px; }
  .muted { color: var(--ink-dim); }
  .btn { appearance: none; border: none; cursor: pointer; border-radius: 999px; padding: 14px 26px; font-size: 1rem; font-weight: 700; font-family: var(--font-body); transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 20px rgba(0,0,0,0.18); }
  .btn-primary:not(:disabled):hover { box-shadow: 0 10px 26px rgba(0,0,0,0.25); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
  .btn-ghost:hover { border-color: var(--ink-faint); }
  .btn-block { width: 100%; }

  .setup-form { display: flex; gap: 10px; margin-top: 4px; }
  .setup-form input { flex: 1; font-size: 1.05rem; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); font-family: inherit; }
  .setup-form input:focus-visible { outline: 3px solid var(--accent); outline-offset: 0; }
  .player-list { list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
  .player-chip { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 999px; padding: 6px 14px; font-weight: 600; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 0.85rem; flex-shrink: 0; }
  .setup-hint { margin-top: 18px; font-size: 0.9rem; }
  .setup-actions { margin-top: 26px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .host-flag { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; color: var(--accent); margin-left: 4px; }

  .room-box { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 12px 16px; margin-top: 18px; flex-wrap: wrap; }
  .room-box code { font-size: 0.95rem; word-break: break-all; }
  .qr-box { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-top: 16px; }
  .qr-box img { background: #fff; padding: 10px; border-radius: 12px; box-shadow: var(--shadow); }

  .scoreboard { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; }
  .score-chip { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 16px; flex-shrink: 0; transition: box-shadow 160ms ease, border-color 160ms ease; }
  .score-chip.active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .score-chip .name { font-weight: 700; font-size: 0.92rem; }
  .score-chip .pts { font-variant-numeric: tabular-nums; color: var(--ink-dim); font-size: 0.82rem; }
  .score-chip.active .pts { color: var(--accent); font-weight: 700; }
  .turn-flag { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 800; color: var(--accent); }

  .board-scroll { overflow-x: auto; padding-bottom: 4px; }
  .board { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 10px; min-width: 640px; }
  .board-head { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px; border-radius: 12px; font-weight: 800; font-size: 0.88rem; text-align: center; color: #fff; text-transform: uppercase; letter-spacing: 0.02em; }
  .board-head .icon { font-size: 1.4rem; }
  .cell { appearance: none; border: none; cursor: pointer; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); padding: 18px 8px; font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; color: var(--accent); transition: transform 120ms ease, box-shadow 120ms ease; width: 100%; }
  .cell:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow); }
  .cell:disabled { cursor: default; color: var(--ink-faint); background: var(--surface-2); display: flex; align-items: center; justify-content: center; }
  .cell.not-my-turn { cursor: not-allowed; }
  .cell .won-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.75rem; font-weight: 800; }

  .question-wrap { display: flex; flex-direction: column; gap: 18px; }
  .q-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .q-cat-badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; }
  .q-value { font-family: var(--font-display); font-size: 1.4rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .q-turn { text-align: center; font-size: 0.9rem; color: var(--ink-dim); }
  .q-turn strong { color: var(--ink); }

  .timer-track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .timer-fill { height: 100%; background: var(--accent); width: 100%; }

  .q-text { font-family: var(--font-display); font-size: clamp(1.3rem, 4vw, 1.9rem); line-height: 1.25; text-align: center; padding: 10px 4px 4px; }

  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .answer-btn { display: flex; align-items: center; gap: 12px; text-align: left; padding: 18px 18px; border-radius: 14px; border: none; cursor: pointer; color: #fff; font-size: 1.02rem; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,0.15); transition: transform 120ms ease, filter 120ms ease, opacity 200ms ease; }
  .answer-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .answer-btn:disabled { cursor: default; }
  .answer-btn .shape { font-size: 1.1rem; flex-shrink: 0; }
  .answer-btn.dim { opacity: 0.35; filter: grayscale(40%); }
  .answer-btn.correct { outline: 3px solid #fff; box-shadow: 0 0 0 4px rgba(255,255,255,0.5); }
  .answer-btn.wrong { opacity: 0.55; }

  .q-result { text-align: center; min-height: 28px; font-weight: 800; font-size: 1.05rem; }
  .q-actions { display: flex; justify-content: center; margin-top: 4px; }

  .end-title { font-family: var(--font-display); text-align: center; font-size: clamp(1.8rem, 6vw, 2.6rem); text-transform: uppercase; }
  .podium { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .podium li { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 14px; background: var(--surface-2); }
  .podium li:first-child { background: color-mix(in srgb, var(--accent) 18%, var(--surface-2)); border: 1.5px solid var(--accent); }
  .rank { font-family: var(--font-display); font-size: 1.3rem; width: 34px; text-align: center; color: var(--ink-dim); }
  .podium li:first-child .rank { color: var(--accent); }
  .podium .pname { flex: 1; font-weight: 700; }
  .podium .pscore { font-variant-numeric: tabular-nums; font-weight: 800; font-family: var(--font-display); }
  .end-actions { display: flex; gap: 12px; justify-content: center; margin-top: 30px; flex-wrap: wrap; }

  .spectator-badge { text-align: center; font-size: 0.82rem; color: var(--ink-dim); background: var(--surface-2); border-radius: 999px; padding: 8px 16px; display: inline-block; margin: 0 auto; }
  .spectator-wrap { display: flex; justify-content: center; }

  .status-line { text-align: center; font-size: 0.85rem; color: var(--ink-dim); min-height: 20px; }
  .status-line.error { color: var(--cat-film); }

  #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

  .footer-note { text-align: center; color: var(--ink-faint); font-size: 0.78rem; margin-top: auto; padding-top: 10px; }

  @media (max-width: 560px) {
    .answers { grid-template-columns: 1fr; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="marquee">
      <div class="eyebrow">Party-Quiz für Freunde &mdash; jede:r auf eigenem Gerät</div>
      <h1>Quiznacht</h1>
      <div class="marquee-bar"><span></span><span></span><span></span><span></span></div>
    </div>

    <div id="scoreboard-slot"></div>
    <div id="screen"></div>
    <div id="status-line" class="status-line"></div>
    <div class="footer-note">Spielstand liegt synchronisiert in Google Drive &mdash; jede:r kann von überall mitspielen.</div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="qrcode.js?v=__CACHE_BUST__"></script>
  <script src="drive-store.js?v=__CACHE_BUST__"></script>
  <script src="app.js?v=__CACHE_BUST__"></script>
</body>
</html>
